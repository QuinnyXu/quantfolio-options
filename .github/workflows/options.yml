name: options-eod

on:
  schedule:
    # Two runs a day (Quinny, 2026-10-01). GitHub cron lags 20-90 min.
    # 15:25 UTC = 11:25 am EDT -> the noon exit check.  19:25 UTC = 3:25 pm EDT -> the closing read for the evening pick.
    # After 2026-11-01 (EST) shift both to 16:25 and 20:25 UTC to keep the same ET times.
    - cron: "25 15 * * 1-5"
    - cron: "25 19 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.json
      - positions.csv
      - fetch_options.py
      - tools/macro_score.py
      - .github/workflows/options.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: options-eod
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests yfinance
      - run: python tools/macro_score.py || echo "macro score failed (non-fatal)"
      - run: python fetch_options.py
      - name: Alerts (GitHub issue on a pick or a flag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/alerts.py || echo "alerts failed (non-fatal)"
      - name: Commit data
        run: |
          git config user.name "options-bot"
          git config user.email "options-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
